<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Pro</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: 'Segoe UI', sans-serif;
          background: #0f172a;
          color: #fff;
        }

        .app {
          display: flex;
          height: 100vh;
        }

        .sidebar {
          width: 260px;
          background: #111827;
          padding: 20px;
          border-right: 1px solid #1f2937;
          display: flex;
          flex-direction: column;
        }

        .room {
          padding: 12px;
          border-radius: 10px;
          background: #1e293b;
          margin-top: 10px;
        }

        .chat {
          flex: 1;
          display: flex;
          flex-direction: column;
          min-width: 0;
        }

        header {
          padding: 20px;
          border-bottom: 1px solid #1f2937;
          font-weight: bold;
        }

        .messages {
          flex: 1;
          padding: 20px;
          display: flex;
          flex-direction: column;
          gap: 15px;
          overflow: auto;
        }

        .message {
          background: #2563eb;
          padding: 12px 16px;
          border-radius: 16px;
          max-width: 70%;
        }

        .composer {
          display: flex;
          gap: 10px;
          padding: 20px;
          border-top: 1px solid #1f2937;
          background: #0f172a;
        }

        input {
          flex: 1;
          padding: 12px;
          border: none;
          border-radius: 10px;
          background: #1e293b;
          color: white;
          font-size: 16px;
          outline: none;
        }

        button {
          padding: 12px 18px;
          border: none;
          border-radius: 10px;
          background: #2563eb;
          color: white;
          font-weight: bold;
          cursor: pointer;
          transition: background 0.2s;
        }

        button:hover {
          background: #1d4ed8;
        }

        @media (max-width: 768px) {
          .app {
            flex-direction: column;
          }

          .sidebar {
            width: 100%;
            height: auto;
            border-right: none;
            border-bottom: 1px solid #1f2937;
            padding: 12px 20px;
          }

          .sidebar h2 {
            font-size: 20px;
            text-align: center;
          }

          .room {
            margin-top: 5px;
            text-align: center;
            padding: 8px;
          }

          .sidebar div[style*="margin-top: auto"] {
            display: none !important;
          }

          header {
            padding: 12px 20px;
            font-size: 15px;
            text-align: center;
          }

          .messages {
            padding: 15px 10px;
          }

          .composer {
            padding: 12px;
          }
        }
    </style>
    <!-- HTMX: оновлюємо чат без перезавантаження сторінки -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h2>Messenger</h2>

            <a href="{% url 'chat_list' %}" style="display: block; color: #38bdf8; text-decoration: none; font-size: 14px; margin-bottom: 12px; font-weight: 500;">
                ← Мої приватні чати
            </a>

            <div class="room active">Global Chat</div>

            <div style="margin-top: auto; padding: 10px; font-size: 14px; color: #94a3b8;">
                Юзер: <strong>{{ request.user.username }}</strong>
            </div>
        </aside>

        <main class="chat">
            <header>Global Chat</header>

            <div id="messages" class="messages">
                {% for msg in messages %}
                    {% include 'chat/partials/global_message.html' %}
                {% empty %}
                    <div id="empty-state" style="text-align: center; color: #64748b; margin-top: 20px;">
                        Повідомлень ще немає. Напишіть щось першим!
                    </div>
                {% endfor %}
            </div>

            <form method="POST" class="composer"
                  hx-post="{% url 'global_chat' %}"
                  hx-target="#messages"
                  hx-swap="beforeend"
                  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
                {% csrf_token %}
                <input id="message" name="text" placeholder="Написати повідомлення..." required autocomplete="off">
                <button type="submit">Надіслати</button>
            </form>
        </main>
    </div>
    <script>
        const messagesBox = document.getElementById('messages');
        if (messagesBox) {
            messagesBox.scrollTop = messagesBox.scrollHeight;
            // Після додавання повідомлення: прибрати підказку «немає повідомлень» і прокрутити вниз
            messagesBox.addEventListener('htmx:afterSwap', () => {
                const empty = document.getElementById('empty-state');
                if (empty) empty.remove();
                messagesBox.scrollTop = messagesBox.scrollHeight;
            });
            // Очистити поле введення після успішної відповіді сервера
            document.querySelector('.composer').addEventListener('htmx:afterRequest', (e) => {
                if (e.detail.successful) e.target.reset();
            });
        }
    </script>
</body>
</html>
